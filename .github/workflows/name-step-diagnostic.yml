name: Isolated name diagnostic (not release CI)

on:
  push:
    branches:
      - 'diagnostic/name-step-44705fb-v1'

permissions:
  contents: read

jobs:
  name-step-diagnostic:
    name: isolated diagnostic, not release CI
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/name-step-44705fb-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: name-step-source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify fixed parent and exact allowed changes
        shell: bash
        run: |
          git -C name-step-source rev-parse HEAD HEAD^{tree}
          test "$(git -C name-step-source rev-parse HEAD^)" = '44705fb96d08d4cee685d263e3d2cd90de3c7dfd'
          python - <<'PY'
          import subprocess
          expected = {'.github/workflows/name-step-diagnostic.yml', 'tools/name_step_diagnostic.py', 'tools/name-step-ci-constraints.txt'}
          changed = set(subprocess.check_output(['git', '-C', 'name-step-source', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Diagnostic change list mismatch: {sorted(changed)}')
          PY
          git -C name-step-source diff --exit-code 44705fb96d08d4cee685d263e3d2cd90de3c7dfd HEAD -- backend/app backend/tests backend/coverage.ini backend/requirements.txt backend/requirements-test.txt .github/workflows/tests.yml
      - name: Install the versions recorded in both original jobs
        timeout-minutes: 2
        run: python -m pip install -r name-step-source/backend/requirements-test.txt -c name-step-source/tools/name-step-ci-constraints.txt
      - name: One bounded four-file name coverage probe
        run: python -u name-step-source/tools/name_step_diagnostic.py --root "$GITHUB_WORKSPACE/name-step-source" --output "$GITHUB_WORKSPACE/name-step-output" --seconds 285
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-name-step-diagnostic
          path: |
            name-step-output/environment.json
            name-step-output/probe.log
            name-step-output/result.json
            name-step-output/stacks/*.log
          if-no-files-found: warn
