name: Tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Backend and service manager regressions
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/config-ci.db
        run: >-
          python -m pytest backend/tests tests -q
          --cov=app.services.config_history
          --cov=app.services.model_identity
          --cov=app.services.config_workbook
          --cov-report=term-missing --cov-fail-under=80
      - name: Probe publication integration and greenlet-aware coverage
        run: >-
          python -m pytest backend/tests/test_probe_workspace.py backend/tests/test_probe_template_definition.py backend/tests/test_probe_material_sync.py backend/tests/test_probe_fixture_safety.py -q
          --cov-config=backend/coverage.ini
          --cov=app.services.probe_workspace
          --cov=app.services.probe_workbook
          --cov=app.services.probe_materials
          --cov=app.services.config_publication
          --cov=app.api.probe_workspace
          --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  probe-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-test.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Shared probe total, per-model results and immutable release journey
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: probe-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ui-previews
          path: |
            frontend/test-results/workspaceLayout-*/**/*.png
            frontend/test-results/knowledgeCompact-*/**/*.png
            frontend/test-results/measurements-*/**/measurement-compact-*.png
          if-no-files-found: ignore

  service-manager:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2 pytest-cov==7.1.0 psutil==7.2.2
      - name: Verify process ownership and launcher lifecycle
        run: python -m pytest tests/test_service_manager.py -q --cov=tools --cov-report=term-missing --cov-fail-under=80
